<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="seal">喵</span><div><strong>喵喵江湖志</strong><small>喵来客栈 · 第一章</small></div></div>
      <div class="wallet"><span>🪙 <b id="coins">0</b></span><span>⚡ <b id="energy">60</b><small>/60</small></span></div>
    </header>
    <main>
      <section class="panel active" id="board-panel" aria-label="合成棋盘">
        <div class="chapter-banner"><span class="chapter-mark">第一章</span><div><strong>一封送错的信</strong><small id="chapter-hint">客栈开张，江湖来客</small></div><button class="text-button" id="story-shortcut">查看线索 ›</button></div>
        <div class="board-head"><div><h2>合成棋盘</h2><small id="board-note">点生成器获取物品，将相同物品合在一起</small></div><div class="energy-time" id="energy-time"></div></div>
        <div class="generators" id="generators"></div>
        <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="六列八行合成棋盘"></div></div>
        <div class="board-actions"><button id="undo" class="secondary" disabled>撤销合成</button><button id="sell" class="secondary danger" disabled>出售选中物品</button></div>
        <div class="orders-title"><h2>来客委托</h2><small>交付物品，结识江湖人物</small></div>
        <div id="orders" class="orders"></div>
      </section>
      <section class="panel" id="inn-panel" aria-label="喵来客栈">
        <div class="scene"><div class="scene-roof">喵 来 客 栈</div><div class="scene-main">🏮 <span>🐈</span> 🏮</div><div class="scene-ground">一盏灯火，迎八方来客</div></div>
        <div class="card"><span class="eyebrow">客栈经营</span><h2 id="inn-name">简陋客栈 · 1级</h2><p id="inn-description"></p><button id="upgrade" class="primary"></button></div>
        <div class="card"><span class="eyebrow">江湖来信</span><h2 id="story-prompt-title">暂无新线索</h2><p id="story-prompt-description"></p><button id="read-story" class="primary" hidden>阅读剧情</button></div>
      </section>
      <section class="panel" id="people-panel" aria-label="江湖人物"><div class="section-intro"><span class="eyebrow">江湖群像</span><h1>故人新识</h1><p>完成专属委托，听他们讲自己的故事。</p></div><div id="people" class="people"></div></section>
      <section class="panel" id="journal-panel" aria-label="江湖手札"><div class="section-intro"><span class="eyebrow">客栈手札</span><h1>一封送错的信</h1><p>故事会在你完成委托后出现；想读时再打开。</p></div><div id="journal"></div><div class="card settings"><h2>设置</h2><button id="reset" class="secondary danger">重新开局</button><small>进度只保存在当前浏览器。清除网站数据也会删除存档。</small></div></section>
    </main>
    <nav class="tabs" aria-label="游戏导航"><button data-tab="board" class="active"><span>▦</span>合成</button><button data-tab="inn"><span>⌂</span>客栈</button><button data-tab="people"><span>♡</span>人物</button><button data-tab="journal"><span>☰</span>手札</button></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"><div id="dialog-content"></div><form method="dialog"><button class="primary" value="close">继续</button></form></dialog>
  <script>
(() => {
  'use strict';
  const KEY = 'miaomiao-jianghu-mvp-v1';
  const CHAINS = {
    food: {name:'猫饭', icon:'🐟', generator:'灶台', items:[['🐟','鲜鱼'],['🍢','鱼串'],['🍣','鱼寿司'],['🍱','江湖便当']]},
    tea: {name:'茶叶', icon:'🍃', generator:'茶炉', items:[['🌱','茶芽'],['🍃','新茶'],['🍵','清茶'],['🫖','上品茶']]},
    herb: {name:'药材', icon:'🌿', generator:'药架', items:[['🌿','草药'],['🪴','药束'],['⚗️','伤药'],['💊','秘制药丸']]}
  };
  const PEOPLE = {
    baomei:{name:'宝妹',emoji:'🐈',role:'喵来客栈老板娘',chain:'food',bio:'性情爽朗，熟知南来北往的消息。她对这封信似乎有所察觉。',stories:[['灶火未熄','夜深时，宝妹仍在灶前煨汤。她说，客栈的门开着，总会有人需要一碗热饭。'],['客栈里的耳朵','每桌客人的闲谈，她都记得一清二楚。宝妹笑说，江湖消息往往比菜先到。']]},
    caizai:{name:'财仔',emoji:'😺',role:'美食家 · 江湖排行榜作者',chain:'food',bio:'对美食有自己的江湖榜单，观察人也同样仔细。',stories:[['一张未完成的榜','财仔郑重其事地把便当记进榜单，却在作者一栏写下了掌柜的名字。'],['榜外之人','他说有些人不能只用名次衡量，能一起吃饭的人，更不该如此。']]},
    xingren:{name:'杏仁',emoji:'🐱',role:'喵剑山庄三小姐',chain:'herb',bio:'身手利落，言语直爽。提到花生时，她会突然安静。',stories:[['药香与剑','杏仁接过伤药，袖口还沾着练剑的尘土。她说家里人总以为她不会受伤。'],['旧日山庄','杏仁记得小时候有人在庭前等她收剑。这个人如今很久没有回来了。']]},
    liuliu:{name:'六六',emoji:'🐈‍⬛',role:'卢家堡义女',chain:'herb',bio:'看似爱恶作剧，做事却有自己的分寸。信是她无意间落下的。',stories:[['小魔王的清单','六六把药材名单写得乱七八糟，背面却画着一幅细致的家人画像。'],['藏起来的话','她说有些玩笑是为了让家里人笑，另一些，是为了不让他们担心。']]}
  };
  const SCENES = [
    {title:'序幕 · 客栈开张',text:'宝妹将一串钥匙交到你手里。\n「灶台、茶炉和药架都能用了。今天来的人，你先替我招呼着。」\n门外传来财仔的声音：「掌柜，有吃的吗？」',need:()=>true},
    {title:'第一幕 · 遗落的信',text:'六六抱着药材跑进客栈，又急匆匆离开。你在桌角发现一封没有署名的信。\n信封上只有一个被雨水浸开的字：花。',need:s=>s.specialDone.liuliu>=1},
    {title:'第二幕 · 山庄来客',text:'杏仁在门前停下，目光落在那封信上。\n「你在哪里找到它的？」她问。你还没回答，她已收起了急切的神色。',need:s=>s.specialDone.xingren>=1},
    {title:'第三幕 · 信往何处',text:'宝妹说，信也许与多年前花生失踪的事有关，但现在谁也不能确定。\n窗外雨停了。你决定先把信交给谁？',need:s=>s.storyRead>=3&&s.specialDone.baomei>=1}
  ];
  const $ = id => document.getElementById(id);
  const blank = () => ({v:1,board:Array(48).fill(null),energy:60,lastEnergy:Date.now(),coins:20,inn:1,normalDone:0,specialDone:{baomei:0,caizai:0,xingren:0,liuliu:0},aff:{baomei:0,caizai:0,xingren:0,liuliu:0},storyRead:0,choice:null,seen:{},normalOrders:[{chain:'food',level:2},{chain:'tea',level:2}],selected:null,undo:null});
  let state;
  try { const saved=JSON.parse(localStorage.getItem(KEY)); state=saved?.v===1&&Array.isArray(saved.board)&&saved.board.length===48?{...blank(),...saved}:blank(); } catch {state=blank();}
  state.selected=null;state.undo=null;
  let tab='board',toastTimer,drag=null,suppressClick=false;
  function save(){try{const {selected,undo,...persistent}=state;localStorage.setItem(KEY,JSON.stringify(persistent));}catch{notice('无法写入本地存档，请检查浏览器设置');}}
  function recover(){const now=Date.now(),elapsed=Math.max(0,now-state.lastEnergy),gain=Math.floor(elapsed/120000);if(gain){state.energy=Math.min(60,state.energy+gain);state.lastEnergy=state.energy===60?now:state.lastEnergy+gain*120000;save();}if(state.energy===60&&state.lastEnergy<now)state.lastEnergy=now;}
  function notice(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500);}
  function itemLabel(item){return item?CHAINS[item.chain].items[item.level-1]:null;}
  function showTab(name){tab=name;document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active',el.id===name+'-panel'));document.querySelectorAll('.tabs button').forEach(el=>el.classList.toggle('active',el.dataset.tab===name));render();window.scrollTo(0,0);}
  function available(chain,level){return state.board.findIndex(x=>x?.chain===chain&&x.level===level);}
  function makeOrder(){const keys=Object.keys(CHAINS);const chain=keys[Math.floor(Math.random()*keys.length)];return {chain,level:state.normalDone<3?2:Math.random()<.65?2:3};}
  function generate(chain){recover();if(!state.energy){notice('体力用完了，稍后再来。棋盘仍可整理。');return;}const slot=state.board.findIndex(x=>!x);if(slot<0){notice('棋盘已满，先合成或出售物品');return;}state.energy--;if(state.energy===59)state.lastEnergy=Date.now();state.board[slot]={chain,level:state.inn>=2&&Math.random()<.18?2:1};state.selected=slot;state.undo=null;save();render();if(state.energy===59&&state.normalDone===0)notice('拖动相同物品到一起，或依次点选两件');}
  function interact(from,to){if(from===to||from<0||to<0||!state.board[from])return;const a=state.board[from],b=state.board[to];if(b){if(a.chain!==b.chain||a.level!==b.level){notice('只有同系列、同等级的物品能合成');return;}if(a.level>=4){notice('当前已是最高等级');return;}state.undo=state.board.map(x=>x?{...x}:null);state.board[to]={chain:a.chain,level:a.level+1};state.board[from]=null;notice('合成成功 · '+itemLabel(state.board[to])[1]);}else{state.board[to]=a;state.board[from]=null;state.undo=null;}state.selected=to;save();render();}
  function cellClick(index){if(suppressClick){suppressClick=false;return;}if(state.selected!==null&&state.selected!==index){if(state.board[state.selected]){interact(state.selected,index);return;}state.selected=null;}state.selected=state.board[index]?index:null;render();}
  function orderRow(key,special){const person=PEOPLE[key],done=state.specialDone[key];const level=Math.min(4,2+Math.floor(done/2));const chain=person.chain;return {key,special,chain,level,label:person.name,emoji:person.emoji};}
  function complete(order){const slot=available(order.chain,order.level);if(slot<0)return;state.board[slot]=null;state.selected=null;state.undo=null;if(order.special){const key=order.key;state.specialDone[key]++;state.aff[key]=Math.min(100,state.aff[key]+20);state.coins+=25+order.level*5;notice(order.label+'的好感提升了');}else{state.normalDone++;state.coins+=12+order.level*6;state.normalOrders[order.key]=makeOrder();notice('委托完成，获得铜钱');}save();render();}
  function renderBoard(){const board=$('board');board.replaceChildren();state.board.forEach((item,index)=>{const el=document.createElement('button');el.type='button';el.className='cell'+(item?' item':'')+(state.selected===index?' selected':'');el.dataset.index=index;el.setAttribute('role','gridcell');el.setAttribute('aria-label',item?`${index+1}格 ${itemLabel(item)[1]} ${item.level}级`:`${index+1}格 空`);if(item){const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=itemLabel(item)[0];el.append(emoji);const level=document.createElement('span');level.className='level';level.textContent='ⅡⅢⅣ'[item.level-2]||'';el.append(level);}board.append(el);});$('undo').disabled=!state.undo;$('sell').disabled=state.selected===null||!state.board[state.selected];$('board-note').textContent=state.selected!==null&&state.board[state.selected]?`已选中：${itemLabel(state.board[state.selected])[1]} · 点击空格移动或同等级物品合成`:'点生成器获取物品，将相同物品合在一起';}
  function renderOrders(){const orders=state.normalOrders.map((o,i)=>({...o,key:i,label:'江湖客人',emoji:'🐾',special:false}));orders.push(...Object.keys(PEOPLE).map(k=>orderRow(k,true)));$('orders').innerHTML='';orders.forEach(o=>{const item=CHAINS[o.chain].items[o.level-1];const el=document.createElement('div');el.className='order'+(o.special?' story-order':'');el.innerHTML=`<div class="order-top"><span></span><span class="tag"></span></div><div class="order-item"><span class="emoji"></span><span></span></div><div class="order-reward"></div>`;el.querySelector('.order-top span').textContent=o.emoji+' '+o.label;el.querySelector('.tag').textContent=o.special?'专属委托':'日常委托';el.querySelector('.order-item span:last-child').textContent=item[1]+' · '+o.level+'级';el.querySelector('.emoji').textContent=item[0];el.querySelector('.order-reward').textContent=o.special?'🪙 '+(25+o.level*5)+' · 好感 +20':'🪙 '+(12+o.level*6);const button=document.createElement('button');button.textContent=available(o.chain,o.level)>=0?'交付物品':'还需合成';button.disabled=available(o.chain,o.level)<0;button.onclick=()=>complete(o);el.append(button);$('orders').append(el);});}
  function renderPeople(){const list=$('people');list.replaceChildren();Object.entries(PEOPLE).forEach(([key,p])=>{const affection=state.aff[key];const rank=affection>=70?'知己':affection>=30?'相熟':'初识';const el=document.createElement('article');el.className='person';el.innerHTML='<div class="portrait"></div><div><h2></h2><small></small><p></p><div class="meter"><span></span></div><small class="affection"></small><div class="stories"></div></div>';el.querySelector('.portrait').textContent=p.emoji;el.querySelector('h2').textContent=p.name;el.querySelector('small').textContent=p.role;el.querySelector('p').textContent=p.bio;el.querySelector('.meter span').style.width=affection+'%';el.querySelector('.affection').textContent=`${rank} · 好感 ${affection}/100`;[30,70].forEach((threshold,i)=>{if(affection>=threshold){const btn=document.createElement('button');btn.textContent='阅读 · '+p.stories[i][0]+' ›';btn.onclick=()=>openStory(p.stories[i][0],p.stories[i][1]);el.querySelector('.stories').append(btn);}});list.append(el);});}
  function nextScene(){return SCENES[state.storyRead]&&SCENES[state.storyRead].need(state)?SCENES[state.storyRead]:null;}
  function openStory(title,text){$('dialog-content').replaceChildren();const heading=document.createElement('h2');heading.textContent=title;const body=document.createElement('p');body.style.whiteSpace='pre-line';body.textContent=text;$('dialog-content').append(heading,body);$('dialog').showModal();}
  function readScene(){const scene=nextScene();if(!scene)return;const index=state.storyRead;if(index===3){$('dialog-content').replaceChildren();const heading=document.createElement('h2');heading.textContent=scene.title;const body=document.createElement('p');body.style.whiteSpace='pre-line';body.textContent=scene.text;$('dialog-content').append(heading,body);[['先交给杏仁','xingren'],['先还给六六','liuliu']].forEach(([label,key])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{state.choice=key;state.storyRead++;state.aff[key]=Math.min(100,state.aff[key]+10);save();$('dialog').close();openStory('第一章 · 尾声',key==='xingren'?'杏仁小心收起信，向你道了谢。她答应有消息会回客栈告诉你。':'六六接过信，沉默了一瞬，答应你会把它妥善保管。');render();};$('dialog-content').append(b);});$('dialog').showModal();}else{state.storyRead++;save();render();openStory(scene.title,scene.text);}}
  function renderJournal(){const prompt=nextScene();$('story-prompt-title').textContent=prompt?prompt.title:state.storyRead===4?'第一章已读完':'暂无新线索';$('story-prompt-description').textContent=prompt?'你可以现在阅读，也可以继续经营客栈。':state.storyRead===4?'江湖的故事还会继续。':'完成角色专属委托后，新的剧情将在这里出现。';$('read-story').hidden=!prompt;$('chapter-hint').textContent=prompt?'有一段故事待阅读':state.storyRead===4?'第一章完':'完成专属委托，发现新线索';const journal=$('journal');journal.replaceChildren();SCENES.forEach((scene,i)=>{const el=document.createElement('div');el.className='story-entry';const h=document.createElement('h2');h.textContent=i<state.storyRead?scene.title:'未解锁的故事';const p=document.createElement('p');p.textContent=i<state.storyRead?'已收录在客栈手札':i===state.storyRead?'继续完成角色委托，故事将在这里出现':'尚未发现';el.append(h,p);if(i<state.storyRead){const button=document.createElement('button');button.textContent='重读 ›';button.onclick=()=>openStory(scene.title,scene.text);el.append(button);}journal.append(el);});if(prompt){const btn=document.createElement('button');btn.className='primary';btn.textContent='阅读新剧情 · '+prompt.title;btn.onclick=readScene;journal.prepend(btn);}}
  function renderInn(){const descriptions=['灶台和茶炉已点起火，客栈正等着第一批江湖来客。','厨房添了新器具，生成物品时偶尔会得到二级材料。','门前灯火更亮了，江湖人愿意在这里多坐一会儿。'];$('inn-name').textContent=['简陋客栈 · 1级','热闹客栈 · 2级','江湖客栈 · 3级'][state.inn-1];$('inn-description').textContent=descriptions[state.inn-1];const price=state.inn===1?60:120;const btn=$('upgrade');btn.textContent=state.inn===3?'已达到最高等级':`升级客栈 · 🪙 ${price}`;btn.disabled=state.inn===3||state.coins<price;}
  function render(){recover();$('coins').textContent=state.coins;$('energy').textContent=state.energy;const remaining=120000-Math.max(0,Date.now()-state.lastEnergy)%120000;$('energy-time').textContent=state.energy===60?'体力已满':`下点体力 ${Math.ceil(remaining/60000)} 分钟内恢复`;renderBoard();renderOrders();renderInn();renderPeople();renderJournal();}
  $('generators').replaceChildren();Object.entries(CHAINS).forEach(([key,chain])=>{const btn=document.createElement('button');btn.className='generator';btn.innerHTML='<span></span><b></b><small>消耗 1 体力</small>';btn.querySelector('span').textContent=chain.icon;btn.querySelector('b').textContent=chain.generator;btn.onclick=()=>generate(key);$('generators').append(btn);});
  $('board').addEventListener('click',e=>{const cell=e.target.closest('.cell');if(cell)cellClick(Number(cell.dataset.index));});
  $('board').addEventListener('pointerdown',e=>{const cell=e.target.closest('.cell');if(!cell||!state.board[Number(cell.dataset.index)])return;drag={from:Number(cell.dataset.index),x:e.clientX,y:e.clientY,moved:false};});
  window.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.moved=true;document.querySelector(`.cell[data-index="${drag.from}"]`)?.classList.add('moving');document.querySelectorAll('.cell.target').forEach(el=>el.classList.remove('target'));document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell')?.classList.add('target');}});
  window.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;document.querySelectorAll('.cell.target,.cell.moving').forEach(el=>el.classList.remove('target','moving'));if(d.moved){suppressClick=true;setTimeout(()=>suppressClick=false,80);const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(target&&Number(target.dataset.index)!==d.from)interact(d.from,Number(target.dataset.index));}});
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('story-shortcut').onclick=()=>showTab('journal');$('read-story').onclick=readScene;
  $('undo').onclick=()=>{if(!state.undo)return;state.board=state.undo;state.undo=null;state.selected=null;save();render();notice('已撤销上次合成');};
  $('sell').onclick=()=>{const i=state.selected;if(i===null||!state.board[i])return;const item=state.board[i];state.coins+=item.level*2;state.board[i]=null;state.selected=null;state.undo=null;save();render();notice('售出 '+itemLabel(item)[1]);};
  $('upgrade').onclick=()=>{const price=state.inn===1?60:120;if(state.inn>=3||state.coins<price)return;state.coins-=price;state.inn++;save();render();notice('客栈升级了');};
  $('reset').onclick=()=>{if(!confirm('确定重新开局？当前进度将被清除。'))return;state=blank();save();showTab('board');notice('新的一局开始了');};
  setInterval(()=>{recover();if(tab==='board'){$('energy').textContent=state.energy;$('energy-time').textContent=state.energy===60?'体力已满':`下点体力 ${Math.ceil((120000-Math.max(0,Date.now()-state.lastEnergy)%120000)/60000)} 分钟内恢复`;}},15000);
  render();
  if(!localStorage.getItem(KEY)){save();setTimeout(()=>notice('先点灶台生成鲜鱼，再试试合成'),600);}
})();

</script>
